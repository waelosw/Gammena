<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gammena – Main réaliste</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05060a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      z-index: 10;
      text-shadow: 0 0 6px #000;
    }
  </style>
</head>
<body>
<div id="info">ZQSD / WASD pour bouger – souris pour regarder</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
  // --- SCÈNE DE BASE ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020308);

  const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
  );
  camera.position.set(0, 1.6, 2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // --- LUMIÈRE GLOBALE ---
  const hemiLight = new THREE.HemisphereLight(0x444466, 0x000000, 0.4);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
  dirLight.position.set(5, 10, 2);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // --- SOL ---
  const floorGeo = new THREE.PlaneGeometry(20, 20);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // --- PERSONNAGE SIMPLE (corps) ---
  const playerGroup = new THREE.Group();
  scene.add(playerGroup);

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222a3a, roughness: 0.7, metalness: 0.1 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.2), bodyMat);
  torso.position.set(0, 1.3, 0);
  torso.castShadow = true;
  playerGroup.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), bodyMat);
  head.position.set(0, 1.8, 0);
  head.castShadow = true;
  playerGroup.add(head);

  // --- GROUPE LAMPE + MAIN (attaché à la caméra pour vue FPS) ---
  const torchGroup = new THREE.Group();
  camera.add(torchGroup);
  scene.add(camera);

  torchGroup.position.set(0.25, -0.25, -0.6);
  torchGroup.rotation.x = -0.2;
  torchGroup.rotation.y = 0.2;

  // --- LAMPE ---
  const torchMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.4 });

  const torchBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.05, 0.35, 16),
    torchMat
  );
  torchBody.rotation.z = Math.PI / 2;
  torchBody.position.set(0, 0, 0);
  torchBody.castShadow = true;
  torchGroup.add(torchBody);

  const torchHead = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.09, 0.12, 16),
    torchMat
  );
  torchHead.rotation.z = Math.PI / 2;
  torchHead.position.set(0.18, 0, 0);
  torchHead.castShadow = true;
  torchGroup.add(torchHead);

  const lightColor = 0xfff2c5;
  const spot = new THREE.SpotLight(lightColor, 2.2, 12, Math.PI / 5, 0.4, 1.2);
  spot.position.set(0.22, 0, 0);
  spot.target.position.set(3, -0.2, -2);
  torchGroup.add(spot);
  torchGroup.add(spot.target);
  spot.castShadow = true;

  const glowGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color: lightColor, transparent: true, opacity: 0.6 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(0.24, 0, 0);
  torchGroup.add(glow);

  // --- MAIN RÉALISTE (VERSION B) ---
  const handGroup = new THREE.Group();
  handGroup.position.set(0.02, -0.02, -0.02);
  handGroup.rotation.x = -0.1;
  handGroup.rotation.y = -0.4;
  torchGroup.add(handGroup);

  const skinColor = 0xd9b08c;
  const skinMat = new THREE.MeshStandardMaterial({
    color: skinColor,
    roughness: 0.55,
    metalness: 0.05
  });

  // Paume plus fine, proportions humaines
  const palmGeo = new THREE.BoxGeometry(0.16, 0.08, 0.11);
  const palm = new THREE.Mesh(palmGeo, skinMat);
  palm.castShadow = true;
  palm.receiveShadow = true;
  palm.position.set(0, -0.02, 0.03);
  handGroup.add(palm);

  // Poignet plus naturel
  const wrist = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.045, 0.12, 12),
    skinMat
  );
  wrist.position.set(-0.08, -0.01, 0.0);
  wrist.rotation.z = Math.PI / 2.4;
  wrist.castShadow = true;
  handGroup.add(wrist);

  // Fonction pour créer un doigt fin avec 3 phalanges
  function createFinger(options) {
    const {
      baseX,
      baseY,
      baseZ,
      length1,
      length2,
      length3,
      radiusBase,
      radiusTip,
      spreadRotZ,
      curl = 0.0
    } = options;

    const fingerGroup = new THREE.Group();
    fingerGroup.position.set(baseX, baseY, baseZ);
    fingerGroup.rotation.z = spreadRotZ;
    handGroup.add(fingerGroup);

    const seg1 = new THREE.Mesh(
      new THREE.CylinderGeometry(radiusBase, radiusBase * 0.95, length1, 10),
      skinMat
    );
    seg1.rotation.x = Math.PI / 2;
    seg1.position.set(0, 0, length1 * 0.5);
    seg1.castShadow = true;
    fingerGroup.add(seg1);

    const seg2Group = new THREE.Group();
    seg2Group.position.set(0, 0, length1);
    seg2Group.rotation.x = curl * 0.6;
    fingerGroup.add(seg2Group);

    const seg2 = new THREE.Mesh(
      new THREE.CylinderGeometry(radiusBase * 0.95, radiusBase * 0.8, length2, 10),
      skinMat
    );
    seg2.rotation.x = Math.PI / 2;
    seg2.position.set(0, 0, length2 * 0.5);
    seg2.castShadow = true;
    seg2Group.add(seg2);

    const seg3Group = new THREE.Group();
    seg3Group.position.set(0, 0, length2);
    seg3Group.rotation.x = curl * 0.9;
    seg2Group.add(seg3Group);

    const seg3 = new THREE.Mesh(
      new THREE.CylinderGeometry(radiusBase * 0.8, radiusTip, length3, 10),
      skinMat
    );
    seg3.rotation.x = Math.PI / 2;
    seg3.position.set(0, 0, length3 * 0.5);
    seg3.castShadow = true;
    seg3Group.add(seg3);

    // Légère sphère au bout (pulpe)
    const tip = new THREE.Mesh(
      new THREE.SphereGeometry(radiusTip * 1.05, 10, 10),
      skinMat
    );
    tip.position.set(0, 0, length3);
    tip.castShadow = true;
    seg3Group.add(tip);

    return fingerGroup;
  }

  // Paramètres de longueur (environ proportions humaines, mais stylisées)
  const baseY = 0.01;
  const baseZ = 0.06;

  // Pouce (plus court, plus sur le côté, incliné)
  createFinger({
    baseX: -0.06,
    baseY: -0.015,
    baseZ: 0.02,
    length1: 0.035,
    length2: 0.03,
    length3: 0.025,
    radiusBase: 0.015,
    radiusTip: 0.011,
    spreadRotZ: -0.9,
    curl: 0.4
  });

  // Index
  createFinger({
    baseX: -0.03,
    baseY,
    baseZ,
    length1: 0.045,
    length2: 0.035,
    length3: 0.03,
    radiusBase: 0.013,
    radiusTip: 0.009,
    spreadRotZ: -0.25,
    curl: 0.35
  });

  // Majeur
  createFinger({
    baseX: 0.0,
    baseY,
    baseZ,
    length1: 0.05,
    length2: 0.04,
    length3: 0.032,
    radiusBase: 0.014,
    radiusTip: 0.009,
    spreadRotZ: -0.05,
    curl: 0.3
  });

  // Annulaire
  createFinger({
    baseX: 0.03,
    baseY,
    baseZ,
    length1: 0.047,
    length2: 0.037,
    length3: 0.03,
    radiusBase: 0.013,
    radiusTip: 0.009,
    spreadRotZ: 0.12,
    curl: 0.32
  });

  // Auriculaire
  createFinger({
    baseX: 0.055,
    baseY,
    baseZ: baseZ - 0.005,
    length1: 0.04,
    length2: 0.032,
    length3: 0.026,
    radiusBase: 0.011,
    radiusTip: 0.008,
    spreadRotZ: 0.3,
    curl: 0.38
  });

  // --- CONTROLES SIMPLES (juste une petite rotation caméra pour tester) ---
  let angle = 0;

  function animate() {
    requestAnimationFrame(animate);

    angle += 0.002;
    playerGroup.position.z = Math.sin(angle) * 0.2;
    playerGroup.position.x = Math.cos(angle) * 0.2;

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
