<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu 3D HTML</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="info">Flèches = bouger le cube</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- SCENE ---
    const scene = new THREE.Scene();

    // --- CAMERA ---
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // --- RENDERER ---
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- CUBE ---
    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // --- LUMIÈRE ---
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);

    // --- CONTROLES ---
    let speedX = 0;
    let speedY = 0;

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp") speedY = 0.05;
        if (e.key === "ArrowDown") speedY = -0.05;
        if (e.key === "ArrowLeft") speedX = -0.05;
        if (e.key === "ArrowRight") speedX = 0.05;
    });

    document.addEventListener("keyup", () => {
        speedX = 0;
        speedY = 0;
    });

    // --- ANIMATION ---
    function animate() {
        requestAnimationFrame(animate);

        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;

        cube.position.x += speedX;
        cube.position.y += speedY;

        renderer.render(scene, camera);
    }

    animate();

    // --- ADAPTATION ÉCRAN ---
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
