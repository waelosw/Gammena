<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Grotte - Jeu 3D Mobile (Torch + Gemmes)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #ui {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 0 0 5px #000;
        }

        #win {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-family: Arial, sans-serif;
            font-size: 28px;
            text-shadow: 0 0 10px #000;
            display: none;
        }
    </style>
</head>
<body>

<div id="info">
    Trouve les 4 gemmes :<br>
    Verte, Rouge, Jaune, Bleue
</div>
<div id="win">Tu as trouvé toutes les gemmes !</div>

<div id="ui">
    <!-- Déplacement -->
    <div class="controls-group">
        <div class="btn-row">
            <div class="btn" data-action="forward">▲</div>
        </div>
        <div class="btn-row">
            <div class="btn" data-action="left">◀</div>
            <div class="btn" data-action="backward">▼</div>
            <div class="btn" data-action="right">▶</div>
        </div>
    </div>

    <!-- Rotation -->
    <div class="controls-group">
        <div class="btn-row">
            <div class="btn" data-action="turnLeft">⟲</div>
            <div class="btn" data-action="turnRight">⟳</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/loaders/GLTFLoader.js"></script>
    
<script>
    // --- SCÈNE, CAMÉRA, RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 1.6, 0); // hauteur "humaine"

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- LUMIÈRE AMBIANTE FAIBLE ---
    const ambient = new THREE.AmbientLight(0x222222, 0.4);
    scene.add(ambient);

// --- MAIN + LAMPE .GLB (VERSION PROPRE) ---

const loader = new THREE.GLTFLoader();

// Charger la main
let handModel;
loader.load("models/hand.glb", (gltf) => {
    handModel = gltf.scene;
    handModel.scale.set(1, 1, 1);
    handModel.position.set(0.25, -0.35, -0.6);
    handModel.rotation.set(0, Math.PI, 0);

    camera.add(handModel);
});

// Charger la lampe torche
loader.load("models/old_oil_lamp.glb", (gltf) => {
    const flashlight = gltf.scene;
    flashlight.scale.set(1, 1, 1);
    flashlight.position.set(0.12, -0.05, -0.05);

    const wait = setInterval(() => {
        if (handModel) {
            handModel.add(flashlight);
            clearInterval(wait);
        }
    }, 50);
});

// --- LUMIÈRE DE LA LAMPE .GLB ---

let flashlightLight;
let flashlightTarget;

const waitLight = setInterval(() => {
    if (handModel) {
        const flashlight = handModel.children.find(c => c);

        if (flashlight) {
            flashlightLight = new THREE.SpotLight(0xfff2c5, 4, 25, Math.PI / 8, 0.4, 1);
            flashlightLight.position.set(0, 0, 0);
            flashlight.add(flashlightLight);

            flashlightTarget = new THREE.Object3D();
            flashlightTarget.position.set(0, 0, -10);
            flashlight.add(flashlightTarget);

            flashlightLight.target = flashlightTarget;

            clearInterval(waitLight);
        }
    }
}, 50);



    // --- GROTTE (SALLE + PIERRES) ---
    const caveMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1, metalness: 0 });

    // Sol
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floor = new THREE.Mesh(floorGeo, caveMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Plafond
    const ceil = new THREE.Mesh(floorGeo, caveMaterial);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.y = 4;
    ceil.receiveShadow = true;
    scene.add(ceil);

    // Murs
    const wallGeo = new THREE.PlaneGeometry(20, 4);

    const wall1 = new THREE.Mesh(wallGeo, caveMaterial);
    wall1.position.set(0, 2, -10);
    wall1.receiveShadow = true;
    scene.add(wall1);

    const wall2 = new THREE.Mesh(wallGeo, caveMaterial);
    wall2.position.set(0, 2, 10);
    wall2.rotation.y = Math.PI;
    wall2.receiveShadow = true;
    scene.add(wall2);

    const wall3 = new THREE.Mesh(wallGeo, caveMaterial);
    wall3.position.set(-10, 2, 0);
    wall3.rotation.y = Math.PI / 2;
    wall3.receiveShadow = true;
    scene.add(wall3);

    const wall4 = new THREE.Mesh(wallGeo, caveMaterial);
    wall4.position.set(10, 2, 0);
    wall4.rotation.y = -Math.PI / 2;
    wall4.receiveShadow = true;
    scene.add(wall4);

    // Pierres au sol (rochers)
    const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 1 });
    const rocks = [];
    for (let i = 0; i < 30; i++) {
        const r = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.4 + Math.random() * 0.8),
            rockMaterial
        );
        const x = (Math.random() - 0.5) * 16;
        const z = (Math.random() - 0.5) * 16;
        r.position.set(x, 0.2 + Math.random() * 0.2, z);
        r.castShadow = true;
        r.receiveShadow = true;
        scene.add(r);
        rocks.push(r);
    }

    // Quelques rochers sur les côtés (comme des parois irrégulières)
    for (let i = 0; i < 20; i++) {
        const r = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.6 + Math.random() * 1.2),
            rockMaterial
        );
        const side = Math.random() < 0.5 ? -9 : 9;
        const z = (Math.random() - 0.5) * 16;
        const y = 0.5 + Math.random() * 2.5;
        r.position.set(side + (Math.random() * 0.8 - 0.4), y, z);
        r.castShadow = true;
        r.receiveShadow = true;
        scene.add(r);
        rocks.push(r);
    }

    // --- GEMMES (PIERRES PRÉCIEUSES) DANS LES COINS ---
    const fragments = [];
    const fragmentData = [
        { color: 0x00ff88, position: new THREE.Vector3(-8, 0.7, -8) }, // vert
        { color: 0xff3344, position: new THREE.Vector3(8, 0.7, -8) },  // rouge
        { color: 0xffee55, position: new THREE.Vector3(-8, 0.7, 8) },  // jaune
        { color: 0x4488ff, position: new THREE.Vector3(8, 0.7, 8) }    // bleu
    ];

    const gemGeo = new THREE.OctahedronGeometry(0.5, 0);

    fragmentData.forEach(data => {
        const mat = new THREE.MeshStandardMaterial({
            color: data.color,
            emissive: data.color,
            emissiveIntensity: 0.9,
            metalness: 0.3,
            roughness: 0.2
        });
        const mesh = new THREE.Mesh(gemGeo, mat);
        mesh.position.copy(data.position);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        fragments.push({ mesh, collected: false, rotSpeed: 0.01 + Math.random() * 0.02 });
    });

    let collectedCount = 0;
    const infoDiv = document.getElementById('info');
    const winDiv = document.getElementById('win');

    function updateInfo() {
        infoDiv.innerHTML = `Gemmes trouvées : ${collectedCount}/4<br>Verte, Rouge, Jaune, Bleue`;
    }
    updateInfo();

    // --- CONTRÔLES MOBILES ---
    const controlsState = {
        forward: false,
        backward: false,
        left: false,
        right: false,
        turnLeft: false,
        turnRight: false
    };

    const speed = 0.08;
    const rotSpeed = 0.04;

    function setControl(action, active) {
        controlsState[action] = active;
    }

    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(btn => {
        const action = btn.getAttribute('data-action');

        const start = (e) => {
            e.preventDefault();
            setControl(action, true);
        };
        const end = (e) => {
            e.preventDefault();
            setControl(action, false);
        };

        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('touchcancel', end);

        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
        btn.addEventListener('mouseleave', end);
    });

    // --- MOUVEMENT DU JOUEUR ---
    const playerPosition = camera.position;
    let playerRotationY = 0;

    function movePlayer() {
        // Rotation
        if (controlsState.turnLeft) {
            playerRotationY += rotSpeed;
        }
        if (controlsState.turnRight) {
            playerRotationY -= rotSpeed;
        }

        camera.rotation.set(0, playerRotationY, 0);

        // Direction avant
        const forward = new THREE.Vector3(
            -Math.sin(playerRotationY),
            0,
            -Math.cos(playerRotationY)
        );
        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

        let move = new THREE.Vector3();

        if (controlsState.forward) move.add(forward);
        if (controlsState.backward) move.sub(forward);
        if (controlsState.left) move.sub(right);
        if (controlsState.right) move.add(right);

        if (move.lengthSq() > 0) {
            move.normalize().multiplyScalar(speed);

            const newPos = playerPosition.clone().add(move);

            // Limites de la grotte
            const limit = 9;
            newPos.x = Math.max(-limit, Math.min(limit, newPos.x));
            newPos.z = Math.max(-limit, Math.min(limit, newPos.z));

            playerPosition.copy(newPos);
        }
    }

    // --- CHECK COLLISION AVEC GEMMES ---
    function checkFragments() {
        fragments.forEach(f => {
            if (f.collected) return;
            const dist = f.mesh.position.distanceTo(camera.position);
            if (dist < 1.2) {
                f.collected = true;
                scene.remove(f.mesh);
                collectedCount++;
                updateInfo();
                if (collectedCount === 4) {
                    winDiv.style.display = 'block';
                }
            }
        });
    }

    // --- ANIMATION ---
    function animate() {
        requestAnimationFrame(animate);

        movePlayer();
        checkFragments();

        // Rotation des gemmes
        fragments.forEach(f => {
            if (!f.collected) {
                f.mesh.rotation.y += f.rotSpeed;
            }
        });

        renderer.render(scene, camera);
    }

    animate();

    // --- ADAPTATION ÉCRAN ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
