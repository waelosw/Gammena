<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Grotte - Jeu 3D Mobile (Torch + Gemmes)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #ui {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 0 0 5px #000;
        }

        #win {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-family: Arial, sans-serif;
            font-size: 28px;
            text-shadow: 0 0 10px #000;
            display: none;
        }
    </style>
</head>
<body>

<div id="info">
    Trouve les 4 gemmes :<br>
    Verte, Rouge, Jaune, Bleue
</div>
<div id="win">Tu as trouvé toutes les gemmes !</div>

<div id="ui">
    <!-- Déplacement -->
    <div class="controls-group">
        <div class="btn-row">
            <div class="btn" data-action="forward">▲</div>
        </div>
        <div class="btn-row">
            <div class="btn" data-action="left">◀</div>
            <div class="btn" data-action="backward">▼</div>
            <div class="btn" data-action="right">▶</div>
        </div>
    </div>

    <!-- Rotation -->
    <div class="controls-group">
        <div class="btn-row">
            <div class="btn" data-action="turnLeft">⟲</div>
            <div class="btn" data-action="turnRight">⟳</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- SCÈNE, CAMÉRA, RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 1.6, 0); // hauteur "humaine"

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- LUMIÈRE AMBIANTE FAIBLE ---
    const ambient = new THREE.AmbientLight(0x222222, 0.4);
    scene.add(ambient);
    const dimLight = new THREE.DirectionalLight(0xffffff, 0.15);
    dimLight.position.set(3, 5, 2);
    scene.add(dimLight);

    // --- LAMPE TORCHE (SPOTLIGHT + POINTLIGHT) ---
    const torchGroup = new THREE.Group();
    camera.add(torchGroup);
    scene.add(camera);

    const torchSpot = new THREE.SpotLight(0xffffff, 4.5, 35, Math.PI / 7, 0.35, 1.2);
    torchSpot.castShadow = true;
    torchSpot.shadow.mapSize.width = 1024;
    torchSpot.shadow.mapSize.height = 1024;
    torchSpot.position.set(0.3, -0.15, -0.4);
    torchGroup.add(torchSpot);

    const torchTarget = new THREE.Object3D();
    torchTarget.position.set(0, -0.1, -5);
    torchGroup.add(torchTarget);
    torchSpot.target = torchTarget;

    const torchPoint = new THREE.PointLight(0xfff4d0, 0.6, 5);
    torchSpot.position.set(0.3, -0.15, -0.4);
    torchGroup.add(torchPoint);

   // --- MAIN RÉALISTE + TORCHE (ajout sans modifier le reste) ---
const handGroup = new THREE.Group();
camera.add(handGroup);

// position de la main par rapport à la caméra
handGroup.position.set(0.25, -0.25, -0.6);
handGroup.rotation.x = -0.3;

const skinMat = new THREE.MeshStandardMaterial({
    color: 0xd8b090,
    roughness: 0.55,
    metalness: 0.05
});

// Paume
const palm = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.1, 0.12),
    skinMat
);
palm.castShadow = true;
palm.receiveShadow = true;
handGroup.add(palm);

// Poignet
const wrist = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.06, 0.12, 12),
    skinMat
);
wrist.position.set(0, 0.09, -0.02);
wrist.rotation.x = Math.PI / 2;
wrist.castShadow = true;
handGroup.add(wrist);

// Doigts
function createFinger(offsetX, isThumb = false) {
    const finger = new THREE.Group();

    const l1 = isThumb ? 0.05 : 0.07;
    const l2 = isThumb ? 0.04 : 0.06;
    const l3 = isThumb ? 0.03 : 0.05;

    const r1 = isThumb ? 0.015 : 0.013;
    const r2 = isThumb ? 0.013 : 0.011;

    const ph1 = new THREE.Mesh(
        new THREE.CylinderGeometry(r1, r1, l1, 10),
        skinMat
    );
    ph1.rotation.z = Math.PI / 2;
    ph1.position.set(0, -0.03, 0.04);
    ph1.castShadow = true;
    finger.add(ph1);

    const ph2 = new THREE.Mesh(
        new THREE.CylinderGeometry(r1 * 0.9, r1 * 0.8, l2, 10),
        skinMat
    );
    ph2.rotation.z = Math.PI / 2;
    ph2.position.set(l1, -0.03, 0.04);
    ph2.castShadow = true;
    finger.add(ph2);

    const ph3 = new THREE.Mesh(
        new THREE.CylinderGeometry(r1 * 0.8, r2, l3, 10),
        skinMat
    );
    ph3.rotation.z = Math.PI / 2;
    ph3.position.set(l1 + l2, -0.03, 0.04);
    ph3.castShadow = true;
    finger.add(ph3);

    const tip = new THREE.Mesh(
        new THREE.SphereGeometry(r2 * 1.1, 10, 10),
        skinMat
    );
    tip.position.set(l1 + l2 + l3, -0.03, 0.04);
    tip.castShadow = true;
    finger.add(tip);

    finger.position.x = offsetX;
    handGroup.add(finger);
}

// 5 doigts
createFinger(-0.07, true);  // pouce
createFinger(-0.04);
createFinger(-0.01);
createFinger(0.02);
createFinger(0.05);

// --- TORCHE attachée à la main ---
const torchGroup = new THREE.Group();
torchGroup.position.set(0.15, -0.05, -0.25);
torchGroup.rotation.x = -0.15;
handGroup.add(torchGroup);

const torchMat = new THREE.MeshStandardMaterial({
    color: 0x222222,
    roughness: 0.4,
    metalness: 0.6
});

const torchBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.05, 0.35, 16),
    torchMat
);
torchBody.rotation.z = Math.PI / 2;
torchBody.castShadow = true;
torchGroup.add(torchBody);

const torchHead = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.09, 0.12, 16),
    torchMat
);
torchHead.rotation.z = Math.PI / 2;
torchHead.position.set(0.18, 0, 0);
torchHead.castShadow = true;
torchGroup.add(torchHead);

const torchLight = new THREE.SpotLight(0xfff2c5, 2.2, 12, Math.PI / 5, 0.4, 1.2);
torchLight.position.set(0.22, 0, 0);
torchLight.target.position.set(3, -0.2, -2);
torchGroup.add(torchLight);
torchGroup.add(torchLight.target);

const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xfff2c5, transparent: true, opacity: 0.6 })
);
glow.position.set(0.24, 0, 0);
torchGroup.add(glow);


    // --- GROTTE (SALLE + PIERRES) ---
    const caveMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1, metalness: 0 });

    // Sol
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floor = new THREE.Mesh(floorGeo, caveMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Plafond
    const ceil = new THREE.Mesh(floorGeo, caveMaterial);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.y = 4;
    ceil.receiveShadow = true;
    scene.add(ceil);

    // Murs
    const wallGeo = new THREE.PlaneGeometry(20, 4);

    const wall1 = new THREE.Mesh(wallGeo, caveMaterial);
    wall1.position.set(0, 2, -10);
    wall1.receiveShadow = true;
    scene.add(wall1);

    const wall2 = new THREE.Mesh(wallGeo, caveMaterial);
    wall2.position.set(0, 2, 10);
    wall2.rotation.y = Math.PI;
    wall2.receiveShadow = true;
    scene.add(wall2);

    const wall3 = new THREE.Mesh(wallGeo, caveMaterial);
    wall3.position.set(-10, 2, 0);
    wall3.rotation.y = Math.PI / 2;
    wall3.receiveShadow = true;
    scene.add(wall3);

    const wall4 = new THREE.Mesh(wallGeo, caveMaterial);
    wall4.position.set(10, 2, 0);
    wall4.rotation.y = -Math.PI / 2;
    wall4.receiveShadow = true;
    scene.add(wall4);

    // Pierres au sol (rochers)
    const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 1 });
    const rocks = [];
    for (let i = 0; i < 30; i++) {
        const r = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.4 + Math.random() * 0.8),
            rockMaterial
        );
        const x = (Math.random() - 0.5) * 16;
        const z = (Math.random() - 0.5) * 16;
        r.position.set(x, 0.2 + Math.random() * 0.2, z);
        r.castShadow = true;
        r.receiveShadow = true;
        scene.add(r);
        rocks.push(r);
    }

    // Quelques rochers sur les côtés (comme des parois irrégulières)
    for (let i = 0; i < 20; i++) {
        const r = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.6 + Math.random() * 1.2),
            rockMaterial
        );
        const side = Math.random() < 0.5 ? -9 : 9;
        const z = (Math.random() - 0.5) * 16;
        const y = 0.5 + Math.random() * 2.5;
        r.position.set(side + (Math.random() * 0.8 - 0.4), y, z);
        r.castShadow = true;
        r.receiveShadow = true;
        scene.add(r);
        rocks.push(r);
    }

    // --- GEMMES (PIERRES PRÉCIEUSES) DANS LES COINS ---
    const fragments = [];
    const fragmentData = [
        { color: 0x00ff88, position: new THREE.Vector3(-8, 0.7, -8) }, // vert
        { color: 0xff3344, position: new THREE.Vector3(8, 0.7, -8) },  // rouge
        { color: 0xffee55, position: new THREE.Vector3(-8, 0.7, 8) },  // jaune
        { color: 0x4488ff, position: new THREE.Vector3(8, 0.7, 8) }    // bleu
    ];

    const gemGeo = new THREE.OctahedronGeometry(0.5, 0);

    fragmentData.forEach(data => {
        const mat = new THREE.MeshStandardMaterial({
            color: data.color,
            emissive: data.color,
            emissiveIntensity: 0.9,
            metalness: 0.3,
            roughness: 0.2
        });
        const mesh = new THREE.Mesh(gemGeo, mat);
        mesh.position.copy(data.position);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        fragments.push({ mesh, collected: false, rotSpeed: 0.01 + Math.random() * 0.02 });
    });

    let collectedCount = 0;
    const infoDiv = document.getElementById('info');
    const winDiv = document.getElementById('win');

    function updateInfo() {
        infoDiv.innerHTML = `Gemmes trouvées : ${collectedCount}/4<br>Verte, Rouge, Jaune, Bleue`;
    }
    updateInfo();

    // --- CONTRÔLES MOBILES ---
    const controlsState = {
        forward: false,
        backward: false,
        left: false,
        right: false,
        turnLeft: false,
        turnRight: false
    };

    const speed = 0.08;
    const rotSpeed = 0.04;

    function setControl(action, active) {
        controlsState[action] = active;
    }

    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(btn => {
        const action = btn.getAttribute('data-action');

        const start = (e) => {
            e.preventDefault();
            setControl(action, true);
        };
        const end = (e) => {
            e.preventDefault();
            setControl(action, false);
        };

        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('touchcancel', end);

        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
        btn.addEventListener('mouseleave', end);
    });

    // --- MOUVEMENT DU JOUEUR ---
    const playerPosition = camera.position;
    let playerRotationY = 0;

    function movePlayer() {
        // Rotation
        if (controlsState.turnLeft) {
            playerRotationY += rotSpeed;
        }
        if (controlsState.turnRight) {
            playerRotationY -= rotSpeed;
        }

        camera.rotation.set(0, playerRotationY, 0);

        // Direction avant
        const forward = new THREE.Vector3(
            -Math.sin(playerRotationY),
            0,
            -Math.cos(playerRotationY)
        );
        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

        let move = new THREE.Vector3();

        if (controlsState.forward) move.add(forward);
        if (controlsState.backward) move.sub(forward);
        if (controlsState.left) move.sub(right);
        if (controlsState.right) move.add(right);

        if (move.lengthSq() > 0) {
            move.normalize().multiplyScalar(speed);

            const newPos = playerPosition.clone().add(move);

            // Limites de la grotte
            const limit = 9;
            newPos.x = Math.max(-limit, Math.min(limit, newPos.x));
            newPos.z = Math.max(-limit, Math.min(limit, newPos.z));

            playerPosition.copy(newPos);
        }
    }

    // --- CHECK COLLISION AVEC GEMMES ---
    function checkFragments() {
        fragments.forEach(f => {
            if (f.collected) return;
            const dist = f.mesh.position.distanceTo(camera.position);
            if (dist < 1.2) {
                f.collected = true;
                scene.remove(f.mesh);
                collectedCount++;
                updateInfo();
                if (collectedCount === 4) {
                    winDiv.style.display = 'block';
                }
            }
        });
    }

    // --- ANIMATION ---
    function animate() {
        requestAnimationFrame(animate);

        movePlayer();
        checkFragments();

        // Rotation des gemmes
        fragments.forEach(f => {
            if (!f.collected) {
                f.mesh.rotation.y += f.rotSpeed;
            }
        });

        renderer.render(scene, camera);
    }

    animate();

    // --- ADAPTATION ÉCRAN ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
