<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gammena</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        #mobileControls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            user-select: none;
        }

        #joystick {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }

        #stick {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
        }
    </style>
</head>
<body>

<div id="joystick"><div id="stick"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/controls/PointerLockControls.js"></script>

<script>
    let scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 2, 18);

    let camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    let renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lumière globale
    const ambient = new THREE.AmbientLight(0x404040, 0.4);
    scene.add(ambient);

    // Lumière directionnelle
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Sol
    const floorGeo = new THREE.PlaneGeometry(200, 200);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Groupe joueur
    const player = new THREE.Group();
    player.add(camera);
    scene.add(player);
    // --- GROTTE ---
    const caveMaterial = new THREE.MeshStandardMaterial({
        color: 0x222222,
        roughness: 1,
        metalness: 0
    });

    function createRock(x, y, z, s) {
        const geo = new THREE.DodecahedronGeometry(s, 0);
        const mesh = new THREE.Mesh(geo, caveMaterial);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }

    for (let i = 0; i < 200; i++) {
        createRock(
            (Math.random() - 0.5) * 40,
            Math.random() * 4,
            (Math.random() - 0.5) * 40,
            Math.random() * 1.5 + 0.5
        );
    }

    // --- GEMMES ---
    const gemMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x0088ff,
        emissiveIntensity: 0.6,
        roughness: 0.2,
        metalness: 0.8
    });

    const gems = [];

    function createGem(x, y, z) {
        const geo = new THREE.OctahedronGeometry(0.25, 0);
        const gem = new THREE.Mesh(geo, gemMaterial);
        gem.position.set(x, y, z);
        gem.castShadow = true;
        scene.add(gem);
        gems.push(gem);
    }

    for (let i = 0; i < 20; i++) {
        createGem(
            (Math.random() - 0.5) * 30,
            0.5,
            (Math.random() - 0.5) * 30
        );
    }

    // --- CONTROLES ---
    const controls = new THREE.PointerLockControls(camera, document.body);

    document.body.addEventListener("click", () => {
        controls.lock();
    });

    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;

    document.addEventListener("keydown", (e) => {
        if (e.code === "KeyW") moveForward = true;
        if (e.code === "KeyS") moveBackward = true;
        if (e.code === "KeyA") moveLeft = true;
        if (e.code === "KeyD") moveRight = true;
    });

    document.addEventListener("keyup", (e) => {
        if (e.code === "KeyW") moveForward = false;
        if (e.code === "KeyS") moveBackward = false;
        if (e.code === "KeyA") moveLeft = false;
        if (e.code === "KeyD") moveRight = false;
    });

    // --- JOYSTICK MOBILE ---
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");

    let joyActive = false;
    let joyX = 0;
    let joyY = 0;

    joystick.addEventListener("touchstart", (e) => {
        joyActive = true;
    });

    joystick.addEventListener("touchmove", (e) => {
        const rect = joystick.getBoundingClientRect();
        const touch = e.touches[0];

        const x = touch.clientX - rect.left - 60;
        const y = touch.clientY - rect.top - 60;

        const dist = Math.sqrt(x * x + y * y);
        const max = 40;

        if (dist > max) {
            joyX = (x / dist) * max;
            joyY = (y / dist) * max;
        } else {
            joyX = x;
            joyY = y;
        }

        stick.style.left = 60 + joyX + "px";
        stick.style.top = 60 + joyY + "px";
    });

    joystick.addEventListener("touchend", () => {
        joyActive = false;
        joyX = 0;
        joyY = 0;
        stick.style.left = "60px";
        stick.style.top = "60px";
    });

    // --- ANIMATION GEMMES ---
    function updateGems() {
        for (let g of gems) {
            g.rotation.y += 0.02;
        }
    }
    // --- MAIN RÉALISTE + TORCHE (VERSION B) ---
    const handGroup = new THREE.Group();
    handGroup.position.set(0.25, -0.25, -0.6);
    handGroup.rotation.x = -0.3;
    camera.add(handGroup);

    const skinMat = new THREE.MeshStandardMaterial({
        color: 0xd8b090,
        roughness: 0.55,
        metalness: 0.05
    });

    // Paume
    const palm = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.1, 0.12),
        skinMat
    );
    palm.castShadow = true;
    palm.receiveShadow = true;
    handGroup.add(palm);

    // Poignet
    const wrist = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.06, 0.12, 12),
        skinMat
    );
    wrist.position.set(0, 0.09, -0.02);
    wrist.rotation.x = Math.PI / 2;
    wrist.castShadow = true;
    handGroup.add(wrist);

    // Fonction doigt réaliste
    function createFinger(offsetX, isThumb = false) {
        const finger = new THREE.Group();

        const l1 = isThumb ? 0.05 : 0.07;
        const l2 = isThumb ? 0.04 : 0.06;
        const l3 = isThumb ? 0.03 : 0.05;

        const r1 = isThumb ? 0.015 : 0.013;
        const r2 = isThumb ? 0.013 : 0.011;

        // Phalange 1
        const ph1 = new THREE.Mesh(
            new THREE.CylinderGeometry(r1, r1, l1, 10),
            skinMat
        );
        ph1.rotation.z = Math.PI / 2;
        ph1.position.set(0, -0.03, 0.04);
        ph1.castShadow = true;
        finger.add(ph1);

        // Phalange 2
        const ph2 = new THREE.Mesh(
            new THREE.CylinderGeometry(r1 * 0.9, r1 * 0.8, l2, 10),
            skinMat
        );
        ph2.rotation.z = Math.PI / 2;
        ph2.position.set(l1, -0.03, 0.04);
        ph2.castShadow = true;
        finger.add(ph2);

        // Phalange 3
        const ph3 = new THREE.Mesh(
            new THREE.CylinderGeometry(r1 * 0.8, r2, l3, 10),
            skinMat
        );
        ph3.rotation.z = Math.PI / 2;
        ph3.position.set(l1 + l2, -0.03, 0.04);
        ph3.castShadow = true;
        finger.add(ph3);

        // Bout du doigt
        const tip = new THREE.Mesh(
            new THREE.SphereGeometry(r2 * 1.1, 10, 10),
            skinMat
        );
        tip.position.set(l1 + l2 + l3, -0.03, 0.04);
        tip.castShadow = true;
        finger.add(tip);

        finger.position.x = offsetX;
        handGroup.add(finger);
    }

    // 5 doigts
    createFinger(-0.07, true);  // pouce
    createFinger(-0.04);
    createFinger(-0.01);
    createFinger(0.02);
    createFinger(0.05);

    // --- TORCHE ---
    const torchGroup = new THREE.Group();
    torchGroup.position.set(0.15, -0.05, -0.25);
    torchGroup.rotation.x = -0.15;
    handGroup.add(torchGroup);

    const torchMat = new THREE.MeshStandardMaterial({
        color: 0x222222,
        roughness: 0.4,
        metalness: 0.6
    });

    const torchBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.05, 0.35, 16),
        torchMat
    );
    torchBody.rotation.z = Math.PI / 2;
    torchBody.castShadow = true;
    torchGroup.add(torchBody);

    const torchHead = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.09, 0.12, 16),
        torchMat
    );
    torchHead.rotation.z = Math.PI / 2;
    torchHead.position.set(0.18, 0, 0);
    torchHead.castShadow = true;
    torchGroup.add(torchHead);

    // Lumière de la torche
    const torchLight = new THREE.SpotLight(0xfff2c5, 2.2, 12, Math.PI / 5, 0.4, 1.2);
    torchLight.position.set(0.22, 0, 0);
    torchLight.target.position.set(3, -0.2, -2);
    torchGroup.add(torchLight);
    torchGroup.add(torchLight.target);

    const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xfff2c5, transparent: true, opacity: 0.6 })
    );
    glow.position.set(0.24, 0, 0);
    torchGroup.add(glow);
    // --- ANIMATION PRINCIPALE ---
    function animate() {
        requestAnimationFrame(animate);

        const speed = 0.08;

        // Déplacement clavier
        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (controls.isLocked) {
            velocity.z = direction.z * speed;
            velocity.x = direction.x * speed;

            player.position.add(controls.getDirection(new THREE.Vector3()).multiplyScalar(velocity.z));
            player.position.add(controls.getRightVector(new THREE.Vector3()).multiplyScalar(velocity.x));
        }

        // Déplacement joystick
        if (joyActive) {
            const joySpeed = 0.05;
            player.position.x += (joyX / 40) * joySpeed;
            player.position.z += (joyY / 40) * joySpeed;
        }

        updateGems();
        renderer.render(scene, camera);
    }

    animate();

    // Resize
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
